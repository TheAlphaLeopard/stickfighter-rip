name: Fetch probe

on:
  workflow_dispatch:
  push:
    branches: [arena/4d004fea-stickfighter-rip]
    paths: [.github/workflows/fetch-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Fetch game directory HTML through translate proxy
        run: |
          rm -rf probe && mkdir -p probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          P='?_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en'
          while IFS='|' read -r label url; do
            [ -z "$label" ] && continue
            echo "=== $label ==="
            curl -sS -L -A "$UA" --max-time 30 -o "probe/$label.html" -D "probe/$label.headers" "$url" \
              || echo "curl failed for $label"
            echo "--- headers ---"; head -c 500 "probe/$label.headers" 2>/dev/null || true
            echo "--- size ---"; wc -c "probe/$label.html" 2>/dev/null || true
            echo "--- first 2500 bytes ---"; head -c 2500 "probe/$label.html" 2>/dev/null || true
            echo
          done <<EOF
          game_index|https://stickfighter-io.translate.goog/games/stick-fighter/$P
          root|https://stickfighter-io.translate.goog/$P
          EOF
      - name: Commit responses back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git diff --cached --quiet && { echo "no new probe data"; exit 0; }
          git commit -m "probe: game index html"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
