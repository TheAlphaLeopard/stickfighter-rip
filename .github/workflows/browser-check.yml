name: Browser check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Headless smoke test (stubbed DOM)
        run: node tests/smoke.js

      - name: Install puppeteer-core
        run: npm install --no-save --no-audit --no-fund puppeteer-core@23

      - name: Locate system Chrome
        run: |
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true
          google-chrome --version || true

      - name: Run the game in real Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/browser.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
